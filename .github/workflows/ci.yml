name: Legacy build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4
      - name: Prepare pinned source dependencies
        run: python3 tools/bootstrap_legacy.py
      - name: Build and test complete source set, then reobfuscate
        run: bash gradlew --no-daemon :build :reobfJar --console=plain
      - name: Verify packaged identity and optional integration
        run: python3 tools/verify_legacy_package.py
      - name: Require runtime-accepted package for release tags
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 tools/verify_legacy_package.py --require-verified-hash
      - name: Prepare release assets and checksums
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PYTHON'
          import hashlib, json, os, shutil
          from pathlib import Path
          identity = json.loads(Path('legacy-identity.json').read_text())
          tag = identity['release_tag']
          version = tag.removeprefix('v')
          if os.environ['REF_TYPE'] == 'tag' and os.environ['REF_NAME'] != tag:
              raise SystemExit('Tag must match packaged version: ' + tag)
          dist = Path('build/release')
          dist.mkdir(parents=True, exist_ok=True)
          names = [f"{identity['modid']}-{version}{suffix}.jar" for suffix in ('', '-sources')]
          for name in names:
              shutil.copyfile(Path('build/libs') / name, dist / name)
          checksums = ''.join(hashlib.sha256((dist / name).read_bytes()).hexdigest() + '  ' + name + '\n' for name in names)
          (dist / 'SHA256SUMS').write_text(checksums)
          shutil.copyfile(Path('docs/releases') / (version + '.md'), dist / 'RELEASE-NOTES.md')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('### Packaged assets\n\n```text\n' + checksums + '```\n')
          PYTHON
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          if-no-files-found: error
          path: build/release/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-reports
          if-no-files-found: warn
          path: build/reports/tests/
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: dist
      - name: Verify downloaded assets
        working-directory: dist
        run: sha256sum --check SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          release_flags=()
          case "$GITHUB_REF_NAME" in
            *alpha*|*beta*|*rc*) release_flags+=(--prerelease) ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.jar dist/SHA256SUMS \
            --verify-tag --title "Powah Legacy ${GITHUB_REF_NAME#v}" \
            --notes-file dist/RELEASE-NOTES.md "${release_flags[@]}"
